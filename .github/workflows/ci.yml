name: F1 Project CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          CI: "false"

  backend:
    name: Go API checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l main.go)" ]; then
            echo "Go formatting check failed:"
            gofmt -d main.go
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

  docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    env:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: ci_test_password
      DB_NAME: f1db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all Docker images
        run: docker compose build

  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - docker

    # Publish only after a successful push to master.
    # Pull requests run tests but do not publish images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: owner
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner_lc }}/f1-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Docker metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner_lc }}/f1-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./src/api
          file: ./src/api/DockerFile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
