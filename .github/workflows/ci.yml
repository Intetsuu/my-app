name: F1 Project CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          CI: "false"

  backend:
    name: Go API checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l main.go)" ]; then
            echo "Go formatting check failed:"
            gofmt -d main.go
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

  docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    env:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: ci_test_password
      DB_NAME: f1db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all Docker images
        run: docker compose build
