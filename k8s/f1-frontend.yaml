apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: f1-frontend
  template:
    metadata:
      labels:
        app: f1-frontend
    spec:
      containers:
        - name: frontend
          image: my-app-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: f1-frontend-service
spec:
  type: ClusterIP
  selector:
    app: f1-frontend
  ports:
    - port: 80
      targetPort: 80
